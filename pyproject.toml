[project]
name = "gwaudit"
version = "0.1.0"
description = "Groundwater Audit: evaluating LLM-assisted groundwater chemistry analysis"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
